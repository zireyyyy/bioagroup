name: BIO-A Candidate Build Validation
on:
  push:
    branches:
      - main
      - candidate/source-component-rebuild-tablet
      - candidate/tablet-source-recovery-20261010
      - candidate/merywood-desktop-scale-restore
      - candidate/bioa-desktop-shell-scale9
      - candidate/footer-social-parity10
      - candidate/header-whatsapp-artwork11
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate changed JavaScript syntax
        run: |
          node --check bioa-source-components.mjs
          node --check bioa-home-refine.mjs
          node --check bioa-transform.mjs
          node --check tests/tablet-browser-smoke.mjs
      - name: Responsive source regression
        run: npm run test:responsive
      - name: Build static website
        run: npm run build
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Collect actual browser geometry across desktop and tablet
        run: node tests/tablet-browser-smoke.mjs
