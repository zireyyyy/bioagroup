name: BIO-A Candidate Build Validation
on:
  push:
    branches:
      - main
      - candidate/source-component-rebuild-tablet
      - candidate/tablet-source-recovery-20261010
      - candidate/merywood-desktop-scale-restore
      - candidate/bioa-desktop-shell-scale9
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate changed JavaScript syntax
        run: |
          node --check bioa-source-components.mjs
          node --check bioa-home-refine.mjs
          node --check bioa-transform.mjs
          node --check tests/tablet-browser-smoke.mjs
          node --check tests/first-paint-browser.test.mjs
          node --check tests/footer-en-layout-browser.test.mjs
      - name: Host isolation gate regression
        run: node --test tests/maintenance-host-gate.test.mjs
      - name: Responsive source regression
        run: npm run test:responsive
      - name: Build static website
        run: npm run build
      - name: Verify single Merywood font source across routes
        run: node tests/single-manrope-font-source.test.mjs
      - name: Verify sole canonical Zalo asset and all VI/EN routes
        run: node tests/zalo-canonical-asset.test.mjs
      - name: Verify Footer brand and social DOM output
        run: node tests/footer-brand-socials.test.mjs
      - name: Check generated BIO-A watermark assets
        run: node tests/brand-watermark-assets.test.mjs
      - name: Check generated HTML first-paint order
        run: node tests/first-paint-build.test.mjs
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify first-paint computed style across routes and viewports
        run: node tests/first-paint-browser.test.mjs
      - name: Collect actual browser geometry across desktop and tablet
        run: node tests/tablet-browser-smoke.mjs
      - name: Verify EN Footer wrap and record first-paint movement
        run: node tests/footer-en-layout-browser.test.mjs
      - name: Preserve Footer EN screenshot + layout-shift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioa-footer-en-wrap-layout-shift
          path: audit-artifacts/footer-en-wrap/
          if-no-files-found: warn
          retention-days: 14
